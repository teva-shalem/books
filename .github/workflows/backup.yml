name: Upload Backup Version

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Download Built Site
      uses: actions/download-artifact@v8
      with:
        name: built-dist
        path: dist
    
    - name: Configure PDF Redirects
      run: |
        rm -rf dist/pdfs

        printf '/pdfs/* %s/pdfs/:splat 302\n' \
          "https://books.tevashalem.com" > dist/_redirects

    - name: Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy dist --project-name=tevadynamica
