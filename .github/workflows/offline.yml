name: Upload Offline Version

on:
  workflow_call:
    secrets:
      RCLONE_CONFIG_GDRIVE:
        required: true
      GDRIVE_FOLDER_ID:
        required: true

jobs:
  zip-to-drive:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Packaging Script & Action
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          .github/actions/setup-node-env
          package.json
          package-lock.json
          scripts/zip-offline.js

    - name: Setup Node.js
      uses: ./.github/actions/setup-node-env

    - name: Cache static-web-server
      uses: actions/cache@v5
      with:
        path: .cache/sws
        key: sws-win-${{ hashFiles('scripts/zip-offline.js') }}

    - name: Install Zip Dependency Only
      run: |
        DEPS=$(node -e "const d = require('./package.json').devDependencies; console.log(['adm-zip'].map(p => p + '@' + d[p]).join(' '))")
        npm install --prefix /tmp --no-save --no-package-lock $DEPS
        ln -s /tmp/node_modules node_modules

    - name: Download Built Site
      uses: actions/download-artifact@v8
      with:
        name: built-dist
        path: dist

    - name: Package Offline Zip
      run: npm run zip-offline

      # The client id & secret will expire. when it happens:
      # Go to https://console.cloud.google.com/auth/clients?project=teva-shalem-forum
      # and re-create the client to get a new client id & secret to give rclone.
      # If necessary, use this as reference: https://rclone.org/drive/#making-your-own-client-id
      # Run "rclone config reconnect gdrive:" or if it's a new computer: "rclone config".
      # Run "rclone config show gdrive" and replace RCLONE_CONFIG_GDRIVE with it
      # in https://github.com/teva-shalem/books-world/settings/secrets/actions
    - name: Setup rclone
      uses: AnimMouse/setup-rclone@v1
      with:
        rclone_config: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
        disable_base64: true

    - name: Upload offline-tevadynamica.zip to Google Drive
      run: |
        rclone copyto dist/offline-tevadynamica.zip gdrive:offline-tevadynamica.zip \
          --drive-root-folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" \
          --progress
