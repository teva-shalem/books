name: CI

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Use Node.js 16
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install Dependencies
      run: npm ci

    - name: Build Site & Generate PDFs
      run: npm run build

    - name: Deploy Stage
      if: github.repository == 'teva-shalem/books-staging'
      uses: crazy-max/ghaction-github-pages@v2.1.0
      with:
        build_dir: dist
        fqdn: books-staging.tevashalem.com
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy World
      if: github.repository == 'teva-shalem/books-world'
      uses: crazy-max/ghaction-github-pages@v2.1.0
      with:
        build_dir: dist
        fqdn: books.tevashalem.com
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
