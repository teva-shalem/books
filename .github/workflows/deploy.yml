name: CI

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # BUILD SITE ONCE
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: ./.github/actions/setup-node-env

    - name: Install Dependencies
      run: npm ci
      env:
        PUPPETEER_SKIP_DOWNLOAD: 'true'

    - name: Build Site
      run: npm run build

    - name: Save Built Site
      uses: actions/upload-artifact@v4
      with:
        name: built-dist
        path: dist
        retention-days: 1

  # UPLOAD ONLINE VERSION
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: ./.github/actions/setup-node-env

    - name: Cache Puppeteer Browser
      uses: actions/cache@v4
      with:
        path: ~/.cache/puppeteer
        key: ${{ runner.os }}-puppeteer-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-puppeteer-

    - name: Install Dependencies
      run: npm ci

    - name: Download Built Site
      uses: actions/download-artifact@v4
      with:
        name: built-dist
        path: dist

    - name: Generate PDFs
      run: npm run generate-pdfs

    # --- GitHub Pages Deployment ---
    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'dist'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    # --- CloudFlare Pages Deployment ---
    # - name: Deploy to Cloudflare Pages
    #   if: github.repository == 'teva-shalem/books-world'
    #   uses: cloudflare/wrangler-action@v3
    #   with:
    #     apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    #     accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    #     command: pages deploy dist --project-name=tevadynamica

  # OFFLINE VERSION
  upload-offline-drive:
    # if: github.repository == 'teva-shalem/books-world'
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Packaging Script & Action
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          .github/actions/setup-node-env
          package.json
          package-lock.json
          scripts/zip-offline.js

    - name: Setup Node.js
      uses: ./.github/actions/setup-node-env

    - name: Cache static-web-server
      uses: actions/cache@v4
      with:
        path: .cache/sws
        key: sws-win-${{ hashFiles('scripts/zip-offline.js') }}

    - name: Install Zip Dependency Only
      run: |
        npm install --prefix /tmp --no-save adm-zip
        ln -s /tmp/node_modules node_modules

    - name: Download Built Site
      uses: actions/download-artifact@v4
      with:
        name: built-dist
        path: dist

    - name: Package Offline Zip
      run: npm run zip-offline

    - name: Setup rclone
      uses: AnimMouse/setup-rclone@v1
      with:
        rclone_config: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
        disable_base64: true

    - name: Upload offline-tevadynamica.zip to Google Drive
      run: |
        rclone copyto dist/offline-tevadynamica.zip gdrive:offline-tevadynamica.zip \
          --drive-root-folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" \
          --progress
