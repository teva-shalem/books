name: CI

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Use Node.js 16
      uses: actions/setup-node@v4
      with:
        node-version: '16'
        cache: 'npm'

    - name: Cache Puppeteer Browser
      uses: actions/cache@v4
      with:
        path: ~/.cache/puppeteer
        key: ${{ runner.os }}-puppeteer-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-puppeteer-

    - name: Cache static-web-server
      uses: actions/cache@v4
      with:
        path: .cache/sws
        key: sws-win-${{ hashFiles('package-offline.mjs') }}

    - name: Install Dependencies
      run: npm ci

    - name: Build Site
      run: npm run build

    - name: Package Offline Zip
      run: npm run zip-offline

    - name: Setup rclone
      uses: AnimMouse/setup-rclone@v1
      with:
        rclone_config: ${{ secrets.RCLONE_CONFIG_GDRIVE }}

    - name: Upload offline-tevadynamica.zip to Google Drive
      run: |
        rclone copyto dist/offline-tevadynamica.zip gdrive:offline-tevadynamica.zip \
          --drive-root-folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" \
          --progress
          
    - name: Generate PDFs
      run: npm run generate-pdfs

    # --- GitHub Pages Deployment ---
    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'dist'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

