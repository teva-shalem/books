name: Upload Online Versions

on:
  workflow_call:

jobs:
  online:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout PDF Script & Action
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          .github/actions/setup-node-env
          package.json
          package-lock.json
          scripts/generate-pdfs.js

    - name: Setup Node.js
      uses: ./.github/actions/setup-node-env

    - name: Cache Puppeteer Browser
      uses: actions/cache@v4
      with:
        path: ~/.cache/puppeteer
        key: ${{ runner.os }}-puppeteer-${{ hashFiles('package.json') }}
        restore-keys: |
          ${{ runner.os }}-puppeteer-

    - name: Install PDF Dependencies Only
      run: |
        DEPS=$(node -e "const d = require('./package.json').devDependencies; console.log(['puppeteer', 'serve-handler'].map(p => p + '@' + d[p]).join(' '))")
        npm install --prefix /tmp --no-save --no-package-lock $DEPS
        ln -s /tmp/node_modules node_modules

    - name: Download Built Site
      uses: actions/download-artifact@v4
      with:
        name: built-dist
        path: dist

    - name: Generate PDFs
      run: npm run generate-pdfs

    # --- GitHub Pages Deployment ---
    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'dist'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

