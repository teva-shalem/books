name: Build Site

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: ./.github/actions/setup-node-env

    - name: Install Dependencies
      run: npm ci --ignore-scripts
      env:
        PUPPETEER_SKIP_DOWNLOAD: "true"

    - name: Get Puppeteer's Chrome revision
      id: chrome
      run: node -p "'revision=' + require('puppeteer-core').PUPPETEER_REVISIONS.chrome" >> "$GITHUB_OUTPUT"

    - name: Cache Chrome for Puppeteer
      id: chrome-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/puppeteer
        key: puppeteer-chrome-${{ runner.os }}-${{ runner.arch }}-${{ steps.chrome.outputs.revision }}

    - name: Install Chrome for Puppeteer
      if: steps.chrome-cache.outputs.cache-hit != 'true'
      run: npx --no-install puppeteer browsers install chrome

    - name: Build Site
      run: npm run build

    - name: Save Built Site
      uses: actions/upload-artifact@v7
      with:
        name: built-dist
        path: dist
        retention-days: 1
